name: Run Notification Worker

on:
  # Optionnel : Exécuter automatiquement toutes les 10 minutes pour vérifier les nouveaux messages
  schedule:
    - cron: '*/10 * * * *'
  
  # Permet aussi de le lancer manuellement depuis l'onglet "Actions" de ton GitHub
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances du worker
        run: npm install
        working-directory: ./worker # (Adapte si ton dossier s'appelle différemment, ex: functions)

      - name: Lancer le worker
        env:
          # Tu pourras stocker ta clé secrète Firebase dans les Secrets GitHub
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node index.js
        working-directory: ./worker
