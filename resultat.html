<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="static/png/naima.png">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultat Secret Santa 🎅</title>
  <link rel="stylesheet" href="static/css/resultat.css">
  <link rel="stylesheet" href="static/css/noel-3d.css">
  <link rel="stylesheet" href="static/css/transitions.css">
  <link rel="stylesheet" href="static/css/pwa-notifications.css">
  <!-- Configuration PWA & iOS Safari -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#830303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noël 2026">
<link rel="apple-touch-icon" href="./static/png/apple-touch-icon.png">
</head>
<body style="background: url('static/png/back.jpeg') center center / cover no-repeat fixed !important;">
  <div id="snow-container"></div>
  <a href="menu.html">
    <img id="back" src="static/png/back.png" class="back" alt="Retour" />
  </a>

  <img id="logo" src="static/png/et.png" class="logo" alt="Secret Santa" />

  <div class="result">
    <h2>Ton tirage</h2>
    <p>Tu dois offrir un cadeau à :</p>
    <p id="resultName" class="highlight">Chargement... 🎁</p>
  </div>

  <div style="text-align: center; margin-top: 15px; position: relative; z-index: 10;">
    <a href="https://www.amazon.com.be/b?node=212919107031&pf_rd_p=26857562-04e2-4bc1-b6e2-c1208342ac9d&pf_rd_r=5V042GZ4E57EA2W6VJPJ&ref_=eu_xmas25_mvn" target="_blank" style="color: #ffd700; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1rem; text-decoration: underline; text-shadow: 0 2px 4px rgba(0,0,0,0.8); background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 20px;">
      🎁 Idée de cadeaux à moins de 15€
    </a>
  </div>

  <img id="tr" src="static/png/tr.png" class="tr" alt="Décoration" />

  <script type="module">
    import { db } from "./static/java/firebase-init.js";
    import { collection, getDocs } 
      from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    async function showResult() {
      const username = localStorage.getItem("username");
      if (!username) {
        window.location.href = "index.html";
        return;
      }

      try {
        const userUpper = username.trim().toUpperCase();
        const snapshot = await getDocs(collection(db, "results"));
        const matchDoc = snapshot.docs.find(d => {
          const p = (d.data().player || "").trim().toUpperCase();
          return p === userUpper;
        });

        if (!matchDoc) {
          // Si pas encore tiré → aller aux règles et au tirage
          window.location.href = "santa.html";
          return;
        }

        const result = matchDoc.data().picked;
        document.getElementById("resultName").textContent = result;
      } catch (err) {
        console.error("Erreur récupération tirage :", err);
        document.getElementById("resultName").textContent = "Erreur de connexion";
      }
    }

    showResult();
  </script>
  <script src="static/java/snow.js"></script>
  <script src="static/java/audio.js"></script>
  <script src="static/java/theme.js"></script>
  <script src="static/java/effects.js"></script>
  <script src="static/java/noel-ui.js"></script>
  <script src="static/java/transitions.js"></script>
  <script src="static/java/pwa-notifications.js"></script>
</body>
</html>
