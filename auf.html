<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Secret - Le Festin d'Hiver</title>
<link rel="stylesheet" href="static/css/noel-3d.css">
<link rel="stylesheet" href="static/css/christmas-camera.css">
<style>
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #1a472a 0%, #052210 100%) !important;
        font-family: 'Comic Sans MS', 'Arial', sans-serif;
        overflow-x: hidden;
    }
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        position: relative;
        z-index: 100;
    }
    .messages-area {
        flex: 1;
        padding: 80px 20px 100px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;
        box-sizing: border-box;
    }
    .msg-wrapper {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 85%;
    }
    .msg-me-wrapper {
        align-self: flex-end;
        flex-direction: row-reverse;
    }
    .msg-them-wrapper {
        align-self: flex-start;
        flex-direction: row;
    }
    .chat-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        object-fit: cover;
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        background: rgba(0,0,0,0.4);
    }
    .msg {
        padding: 10px 16px;
        border-radius: 15px;
        font-size: 1.05rem;
        position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        border: 2px solid var(--gold);
        display: flex;
        flex-direction: column;
        gap: 3px;
        word-break: break-word;
    }
    .msg-sender-name {
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--gold);
    }
    .msg-me {
        background: linear-gradient(135deg, var(--bright-red), var(--dark-red));
        color: white;
        border-bottom-right-radius: 2px;
    }
    .msg-me .msg-sender-name {
        color: #ffd700;
    }
    .msg-them {
        background: white;
        color: #333;
        border-bottom-left-radius: 2px;
    }
    .msg-them .msg-sender-name {
        color: #8b0000;
    }
    .input-bar {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        padding: 10px;
        border-radius: 50px;
        border: 3px solid var(--gold);
        z-index: 1000;
    }
    .input-bar input {
        flex: 1;
        padding: 12px 20px;
        border-radius: 25px;
        border: none;
        background: white;
        color: #333;
        font-size: 1rem;
        outline: none;
    }
    .input-bar button {
        background: var(--gold);
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        color: var(--dark-red);
        box-shadow: 0 4px 0 #b8860b;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        width: 50px;
    }
</style>
<link rel="stylesheet" href="static/css/transitions.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<a href="lpn.html" class="back-btn">
    <img src="static/png/back.png" style="width: 100%" alt="Retour">
</a>

<div class="chat-container">
    <div class="messages-area" id="messages"></div>
    <div id="attachedPreview"></div>
    <div class="input-bar">
        <button type="button" class="chat-media-btn" id="chatPhotoBtn" title="Envoyer une photo">📷</button>
        <input type="text" id="messageInput" placeholder="Écris un message...">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script src="static/java/christmas-camera.js"></script>
<script type="module">
import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js"; 
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js"; 

const firebaseConfig = {
    apiKey: "AIzaSyBVQh_y9U1D5gA7BmCCFJgOlEPlUAogxV8",
    authDomain: "santa-secret-3c1f4.firebaseapp.com",
    projectId: "santa-secret-3c1f4",
    storageBucket: "santa-secret-3c1f4.firebasestorage.app",
    messagingSenderId: "238129661360",
    appId: "1:238129661360:web:d6ccb73539dc67d9f68275"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const currentUser = localStorage.getItem("username");
let assignedPlayer = null;

const messagesList = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
let pendingPhotoBase64 = null;

async function fetchAssignedPlayer() {
    const resultsRef = collection(db, "results");
    const q = query(resultsRef, where("player", "==", currentUser));
    const querySnapshot = await getDocs(q);
    if (!querySnapshot.empty) {
        assignedPlayer = querySnapshot.docs[0].data().picked;
        setupChat();
    }
}

function getChatId(u1, u2) { return [u1, u2].sort().join('_'); }

function setupChat() {
    if (!currentUser || !assignedPlayer) return;
    const chatId = getChatId(currentUser, assignedPlayer);
    const q = query(collection(db, "chats/" + chatId + "/messages"), orderBy("timestamp", "asc")); 
    onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
            if (change.type === "added") displayMessage(change.doc.data());
        });
    });
    sendBtn.onclick = sendMessage;
}

const SANTA_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%238b0000' stroke='%23ffd700' stroke-width='4'/><text x='50' y='67' font-size='52' text-anchor='middle'>🎅</text></svg>";

async function sendMessage() {
    const content = messageInput.value.trim();
    if ((content || pendingPhotoBase64) && currentUser && assignedPlayer) {
        const chatId = getChatId(currentUser, assignedPlayer);
        const docData = {
            sender: currentUser,
            content: content,
            timestamp: serverTimestamp(),
            avatar: 'santa'
        };
        if (pendingPhotoBase64) {
            docData.photo = pendingPhotoBase64;
        }
        await addDoc(collection(db, "chats/" + chatId + "/messages"), docData);
        messageInput.value = '';
        pendingPhotoBase64 = null;
        if (attachedPreview) attachedPreview.innerHTML = '';
    }
}

function displayMessage(msg) {
    const isMe = msg.sender === currentUser;
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ' + (isMe ? 'msg-me-wrapper' : 'msg-them-wrapper');

    // Dans auf.html, currentUser est le Père Noël secret
    const isSanta = isMe;
    const senderName = isSanta ? 'Père Noël 🎅 (Toi - Secret)' : assignedPlayer;
    const avatarSrc = isSanta 
        ? SANTA_AVATAR 
        : (msg.avatar && msg.avatar !== 'santa' ? msg.avatar : 'static/png/naima.png');

    wrapper.innerHTML = `
        <img class="chat-avatar" src="${avatarSrc}" alt="${senderName}">
        <div class="msg ${isMe ? 'msg-me' : 'msg-them'}">
            <span class="msg-sender-name">${senderName}</span>
            <span class="msg-text">${msg.content}</span>
            ${msg.photo ? `<img src="${msg.photo}" class="chat-photo-img" onclick="ChristmasCamera.openLightbox(this.src)" alt="Photo">` : ''}
        </div>
    `;
    messagesList.appendChild(wrapper);
    messagesList.scrollTop = messagesList.scrollHeight;
}

messageInput.onkeyup = (e) => { if (e.key === "Enter") sendBtn.click(); };

// Photo attachment
const chatPhotoBtn = document.getElementById('chatPhotoBtn');
const attachedPreview = document.getElementById('attachedPreview');

chatPhotoBtn.onclick = () => {
    ChristmasCamera.open({
        title: "Photo de Noël 📸",
        maxDim: 600,
        onCapture: (base64) => {
            pendingPhotoBase64 = base64;
            attachedPreview.innerHTML = `
                <div class="chat-attached-preview">
                    <img src="${base64}" alt="Photo attachée">
                    <span>📷 Photo prête à envoyer</span>
                    <button class="chat-attached-remove" id="removeAttached">✕</button>
                </div>
            `;
            document.getElementById('removeAttached').onclick = () => {
                pendingPhotoBase64 = null;
                attachedPreview.innerHTML = '';
            };
        }
    });
};

fetchAssignedPlayer();
</script>
<script src="static/java/audio.js"></script>
<script src="static/java/theme.js"></script>
<script src="static/java/effects.js"></script>
<script src="static/java/noel-ui.js"></script>
<script src="static/java/transitions.js"></script>
</body>
</html>
