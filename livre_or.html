<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livre d'Or - Le Festin d'Hiver</title>
  <link rel="stylesheet" href="static/css/noel-3d.css">
  <link rel="stylesheet" href="static/css/christmas-camera.css">
  <style>
      body {
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 100vh;
          margin: 0;
          padding: 20px;
          box-sizing: border-box;
      }
      .back {
          position: absolute;
          top: 20px;
          left: 20px;
          width: 50px;
          z-index: 1000;
      }
      .back img {
          width: 100%;
          display: block;
      }
      .guestbook-container {
          width: 90%;
          max-width: 700px;
          background: rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(15px);
          border: 6px solid var(--gold);
          border-radius: 40px;
          padding: 30px;
          color: white;
          font-family: 'Comic Sans MS', 'Arial', sans-serif;
          box-shadow: 0 20px 50px rgba(0,0,0,0.8);
          position: relative;
          z-index: 100;
          margin-top: 80px;
      }
      .guestbook-header {
          text-align: center;
          margin-bottom: 30px;
      }
      .guestbook-header h1 {
          font-family: 'Chango', cursive;
          color: var(--gold);
          font-size: 2.5rem;
          text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
          margin: 0;
      }
      .post-form {
          display: flex;
          flex-direction: column;
          gap: 15px;
          margin-bottom: 40px;
          padding: 20px;
          background: rgba(255,255,255,0.1);
          border-radius: 20px;
          border: 2px solid var(--gold);
      }
      .post-form input, .post-form textarea {
          padding: 12px;
          border-radius: 10px;
          border: 2px solid var(--gold);
          background: white;
          color: #333;
          font-family: 'Poppins', sans-serif;
          outline: none;
      }
      .post-form button {
          background: var(--gold);
          border: none;
          padding: 12px;
          border-radius: 10px;
          font-weight: bold;
          cursor: pointer;
          color: var(--dark-red);
          text-transform: uppercase;
      }
      .messages-list {
          display: flex;
          flex-direction: column;
          gap: 20px;
      }
      .guest-message {
          background: rgba(255,255,255,0.1);
          padding: 20px;
          border-radius: 20px;
          border-left: 5px solid var(--gold);
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          animation: slideIn 0.4s ease-out;
      }
      .guest-content {
          display: flex;
          align-items: flex-start;
          gap: 12px;
          flex: 1;
      }
      .guest-avatar {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 2px solid var(--gold);
          object-fit: cover;
          flex-shrink: 0;
          box-shadow: 0 2px 6px rgba(0,0,0,0.5);
          background: rgba(0,0,0,0.4);
      }
      .guest-info h3 {
          margin: 0;
          color: var(--gold);
          font-size: 1.2rem;
      }
      .guest-info p {
          margin: 5px 0 0 0;
          font-size: 1.1rem;
          line-height: 1.4;
      }
      .like-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 5px;
      }
      .like-btn {
          background: none;
          border: 1px solid var(--gold);
          color: var(--gold);
          border-radius: 50%;
          width: 40px;
          height: 40px;
          cursor: pointer;
          transition: all 0.2s;
      }
      .like-btn.liked {
          background: var(--bright-red);
          color: white;
          border-color: var(--bright-red);
      }
      .like-count {
          font-size: 0.8rem;
          font-weight: bold;
      }
      @keyframes slideIn {
          from { opacity: 0; transform: translateX(-20px); }
          to { opacity: 1; transform: translateX(0); }
      }
      @media (max-width: 600px) {
          .back {
              width: 40px;
          }
      }
  </style>
<link rel="manifest" href="manifest.json">
</head>
<body style="background: radial-gradient(circle at center, #1a472a 0%, #052210 100%) !important;">
    <a href="menu.html" class="back">
        <img src="static/png/back.png" alt="Retour" />
    </a>

    <div class="guestbook-container">
        <div class="guestbook-header">
            <h1>📖 Livre d'Or de Noël 📖</h1>
            <p>Laissez un souvenir ou un message pour la famille !</p>
        </div>

        <div class="post-form">
            <input type="text" id="guestName" placeholder="Ton prénom...">
            <textarea id="guestMessage" rows="3" placeholder="Ton message secret..."></textarea>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button type="button" class="chat-media-btn" id="guestPhotoBtn" title="Ajouter une photo" style="flex-shrink: 0;">📷</button>
                <div id="guestPhotoPreview" style="flex: 1;"></div>
            </div>
            <button id="postBtn">Publier mon souvenir ✨</button>
        </div>

        <div class="messages-list" id="messagesList">
            <!-- Messages will appear here -->
        </div>
    </div>

    <script src="static/java/christmas-camera.js"></script>
    <script type="module">
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, updateDoc, doc, arrayUnion, arrayRemove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVQh_y9U1D5gA7BmCCFJgOlEPlUAogxV8",
            authDomain: "santa-secret-3c1f4.firebaseapp.com",
            projectId: "santa-secret-3c1f4",
            storageBucket: "santa-secret-3c1f4.firebasestorage.app",
            messagingSenderId: "238129661360",
            appId: "1:238129661360:web:d6ccb73539dc67d9f68275"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const guestbookRef = collection(db, "guestbook");

        const postBtn = document.getElementById('postBtn');
        const nameInput = document.getElementById('guestName');
        const msgInput = document.getElementById('guestMessage');
        const list = document.getElementById('messagesList');

        let pendingGuestPhoto = null;

        postBtn.onclick = async () => {
            const name = nameInput.value.trim();
            const text = msgInput.value.trim();
            if (name && (text || pendingGuestPhoto)) {
                try {
                    const userAvatar = localStorage.getItem('userAvatar') || '';
                    const docData = {
                        name: name,
                        text: text,
                        timestamp: serverTimestamp(),
                        likes: [],
                        avatar: userAvatar
                    };
                    if (pendingGuestPhoto) {
                        docData.photo = pendingGuestPhoto;
                    }
                    await addDoc(guestbookRef, docData);
                    nameInput.value = '';
                    msgInput.value = '';
                    pendingGuestPhoto = null;
                    guestPhotoPreview.innerHTML = '';
                } catch (e) {
                    console.error("Error adding document: ", e);
                    alert("Erreur lors de l'envoi. Vérifie tes règles Firestore !");
                }
            } else {
                alert("Remplis ton nom et ton message ! 🎅");
            }
        };

        // Photo pour le livre d'or
        const guestPhotoBtn = document.getElementById('guestPhotoBtn');
        const guestPhotoPreview = document.getElementById('guestPhotoPreview');

        guestPhotoBtn.onclick = () => {
            ChristmasCamera.open({
                title: "Photo pour le Livre d'Or 📖",
                maxDim: 600,
                onCapture: (base64) => {
                    pendingGuestPhoto = base64;
                    guestPhotoPreview.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 8px; background: rgba(255,215,0,0.15); border: 1px solid #ffd700; border-radius: 10px; padding: 6px 10px;">
                            <img src="${base64}" style="width: 45px; height: 45px; border-radius: 8px; object-fit: cover; border: 2px solid #ffd700;">
                            <span style="color: #ffd700; font-size: 0.8rem; flex: 1;">📷 Photo prête</span>
                            <button type="button" onclick="document.getElementById('guestPhotoPreview').innerHTML=''; window._clearGuestPhoto();" style="background: #ff4444; color: white; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.7rem;">✕</button>
                        </div>
                    `;
                }
            });
        };

        // Expose clear function globally for the inline onclick
        window._clearGuestPhoto = () => { pendingGuestPhoto = null; };

        const q = query(guestbookRef, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            list.innerHTML = '';
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const id = docSnap.id;
                const likes = data.likes || [];
                const avatarSrc = data.avatar || (data.name === localStorage.getItem('username') ? (localStorage.getItem('userAvatar') || 'static/png/naima.png') : 'static/png/naima.png');

                const div = document.createElement('div');
                div.className = 'guest-message';
                div.innerHTML = `
                    <div class="guest-content">
                        <img src="${avatarSrc}" class="guest-avatar" alt="${data.name}">
                        <div class="guest-info">
                            <h3>${data.name}</h3>
                            <p>${data.text}</p>
                            ${data.photo ? `<img src="${data.photo}" class="chat-photo-img" onclick="ChristmasCamera.openLightbox(this.src)" alt="Photo" style="margin-top: 8px;">` : ''}
                        </div>
                    </div>
                    <div class="like-section">
                        <button class="like-btn ${likes.includes(localStorage.getItem('username')) ? 'liked' : ''}" data-id="${id}">❤️</button>
                        <span class="like-count">${likes.length}</span>
                    </div>
                `;
                list.appendChild(div);
            });

            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    const id = e.target.dataset.id;
                    const docRef = doc(db, "guestbook", id);
                    const currentLikes = snapshot.docs.find(d => d.id === id).data().likes || [];
                    const user = localStorage.getItem('username') || 'Anonyme';

                    if (currentLikes.includes(user)) {
                        await updateDoc(docRef, { likes: arrayRemove(user) });
                    } else {
                        await updateDoc(docRef, { likes: arrayUnion(user) });
                    }
                };
            });
        });
    </script>
    <script src="static/java/theme.js"></script>
    <script src="static/java/effects.js"></script>
    <script src="static/java/noel-ui.js"></script>
</body>
</html>
