<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="static/png/naima.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Chango&display=swap" rel="stylesheet">
<title>Chat Secret - Le Festin d'Hiver</title>
<link rel="stylesheet" href="static/css/aup.css">
<link rel="stylesheet" href="static/css/noel-3d.css">
<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: block; /* Changé de flex à block pour éviter les problèmes de centrage mobile */
        position: relative;
    }
    .chat-wrapper {
        width: 90%;
        max-width: 500px;
        height: 80vh;
        margin: 5vh auto;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 100;
        box-sizing: border-box;
    }
    .chat-header {
        background: linear-gradient(to right, var(--bright-red), var(--dark-red));
        padding: 20px;
        border-radius: 20px 20px 0 0;
        border: 4px solid var(--gold);
        border-bottom: none;
        text-align: center;
        box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
    }
    .chat-header h2 {
        margin: 0;
        font-family: 'Chango', cursive;
        color: var(--gold);
        font-size: 1.5rem;
        text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }
    .chat-messages-area {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-left: 4px solid var(--gold);
        border-right: 4px solid var(--gold);
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .chat-footer {
        background: rgba(255, 255, 255, 0.2);
        padding: 15px;
        border-radius: 0 0 20px 20px;
        border: 4px solid var(--gold);
        border-top: none;
        display: flex;
        gap: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    #messageInput {
        flex: 1;
        padding: 12px 20px;
        border-radius: 25px;
        border: 2px solid var(--gold);
        background: white;
        color: #333;
        font-size: 1rem;
        outline: none;
    }
    #sendBtn {
        background: var(--gold);
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        color: var(--dark-red);
        box-shadow: 0 4px 0 #b8860b;
        transition: all 0.1s;
    }
    #sendBtn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b8860b;
    }
    .msg {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 15px;
        font-size: 1rem;
        position: relative;
        animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    .msg-me {
        align-self: flex-end;
        background: var(--bright-red);
        color: white;
        border-bottom-right-radius: 2px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        border: 1px solid var(--gold);
    }
    .msg-them {
        align-self: flex-start;
        background: white;
        color: #333;
        border-bottom-left-radius: 2px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        border: 1px solid var(--gold);
    }
</head>
<body>

<a href="lpn.html" class="back-link">
    <img id="back" src="static/png/back.png" class="back" alt="Retour" />
</a>

<div class="chat-wrapper">
    <div class="chat-header">
        <h2>🎅 Chat Secret 🎁</h2>
    </div>
    <div class="chat-messages-area" id="messages">
        <!-- Messages will appear here -->
    </div>
    <div class="chat-footer">
        <input type="text" id="messageInput" placeholder="Votre message secret...">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script type="module">
import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js"; 
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js"; 

const firebaseConfig = {
    apiKey: "AIzaSyBVQh_y9U1D5gA7BmCCFJgOlEPlUAogxV8",
    authDomain: "santa-secret-3c1f4.firebaseapp.com",
    projectId: "santa-secret-3c1f4",
    storageBucket: "santa-secret-3c1f4.firebasestorage.app",
    messagingSenderId: "238129661360",
    appId: "1:238129661360:web:d6ccb73539dc67d9f68275"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const currentUser = localStorage.getItem("username");
let assignedPlayer = null;

const messagesList = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

async function requestNotificationPermission() {
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        await Notification.requestPermission();
    }
}

async function fetchAssignedPlayer() {
    const resultsRef = collection(db, "results");
    const q = query(resultsRef, where("picked", "==", currentUser));
    const querySnapshot = await getDocs(q);

    if (!querySnapshot.empty) {
        assignedPlayer = querySnapshot.docs[0].data().player;
        setupChat();
    }
}

function getChatId(user1, user2) {
    return [user1, user2].sort().join('_');
}

function setupChat() {
    if (!currentUser || !assignedPlayer) return;

    const chatId = getChatId(currentUser, assignedPlayer);
    const messagesRef = collection(db, `chats/${chatId}/messages`);
    const q = query(messagesRef, orderBy("timestamp", "asc")); 

    onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
                const data = change.doc.data();
                displayMessage(data);
                if (data.sender !== currentUser) {
                    if (Notification.permission === "granted") {
                        new Notification("Nouveau message de Noël ! 🎄", {
                            body: data.content,
                            icon: "static/png/naima.png"
                        });
                    }
                }
            }
        });
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
}

async function sendMessage() {
    const content = messageInput.value.trim();
    if (content && currentUser && assignedPlayer) {
        const chatId = getChatId(currentUser, assignedPlayer);
        const messagesRef = collection(db, `chats/${chatId}/messages`);

        await addDoc(messagesRef, {
            sender: currentUser,
            receiver: assignedPlayer,
            content: content,
            timestamp: serverTimestamp()
        });
        messageInput.value = '';
    }
}

function displayMessage(message) {
    const div = document.createElement('div');
    div.classList.add('msg');

    if (message.sender === currentUser) {
        div.classList.add('msg-me');
        div.textContent = message.content;
    } else {
        div.classList.add('msg-them');
        div.textContent = message.content;
    }
    
    messagesList.appendChild(div);
    messagesList.scrollTop = messagesList.scrollHeight;
}

requestNotificationPermission();
fetchAssignedPlayer();
</script>
<script src="static/java/theme.js"></script>
<script src="static/java/effects.js"></script>
<script src="static/java/noel-ui.js"></script>
</body>
</html>
