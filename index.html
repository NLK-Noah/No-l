<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="static/png/naima.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Chango&display=swap" rel="stylesheet">
  <title>Le Festin d'Hiver</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="static/css/noel-3d.css">
  <style>
      body {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          padding: 0;
          flex-direction: column;
          box-sizing: border-box;
          overflow: hidden; /* Supprime tout scroll */
      }
      .grinch-title {
          width: clamp(250px, 70vw, 550px);
          height: auto;
          margin-bottom: 10px;
          filter: drop-shadow(0 0 20px var(--bright-red));
          z-index: 100;
          animation: float 3s ease-in-out infinite;
          display: block;
          margin-left: auto;
          margin-right: auto;
          flex-shrink: 0;
      }
      @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-15px); }
      }
      .countdown-container {
          text-align: center;
          padding: 20px;
          background: rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(15px);
          border: 6px solid var(--gold);
          border-radius: 40px;
          width: 90%;
          max-width: 550px;
          color: white;
          font-family: 'Chango', cursive;
          box-shadow: 0 20px 50px rgba(0,0,0,0.8);
          position: relative;
          z-index: 100;
          box-sizing: border-box;
      }
      .timer {
          display: flex;
          justify-content: center;
          gap: 10px;
          flex-wrap: wrap;
          margin-bottom: 20px;
      }
      .timer-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          min-width: 60px;
      }
      .timer-val {
          font-size: clamp(1.8rem, 6vw, 3rem);
          font-weight: bold;
          color: white;
          text-shadow: 0 0 10px var(--bright-red);
      }
      .timer-label {
          font-size: 0.7rem;
          color: var(--gold);
          text-transform: uppercase;
      }
      .login-section {
          margin-top: 10px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          width: 100%;
      }
      .login-input {
          padding: 10px 20px;
          border-radius: 25px;
          border: 3px solid var(--gold);
          background: white;
          color: #333;
          font-size: 1rem;
          text-align: center;
          outline: none;
          width: 100%;
          max-width: 280px;
          font-family: 'Poppins', sans-serif;
          box-sizing: border-box;
      }
      .entry-btn-wrapper {
          margin-top: 5px;
          width: 100%;
          display: flex;
          justify-content: center;
      }
  </style>
<link rel="stylesheet" href="static/css/transitions.css">
<link rel="stylesheet" href="static/css/pwa-notifications.css">
<!-- Configuration PWA & iOS Safari -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#830303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noël 2026">
<link rel="apple-touch-icon" href="./static/png/apple-touch-icon.png">
</head>
<body style="background: url('static/png/back.jpeg') center center / cover no-repeat fixed !important;">
    <div id="snow-container"></div>

    <img src="static/png/Grinch.png" class="grinch-title" alt="Grinch">

    <div class="countdown-container">
        <div class="timer">
            <div class="timer-item"><span id="days" class="timer-val">00</span><span class="timer-label">Jours</span></div>
            <div class="timer-item"><span id="hours" class="timer-val">00</span><span class="timer-label">Heures</span></div>
            <div class="timer-item"><span id="mins" class="timer-val">00</span><span class="timer-label">Mins</span></div>
            <div class="timer-item"><span id="secs" class="timer-val">00</span><span class="timer-label">Secs</span></div>
        </div>

        <div class="login-section">
            <input type="text" id="usernameInput" class="login-input" placeholder="Ton nom ou prénom..." autocomplete="username">
            <input type="password" id="passwordInput" class="login-input" placeholder="Ton mot de passe personnel 🔒" autocomplete="current-password">
            <div id="loginErrorMsg" style="color: #ffb4b4; background: rgba(180, 0, 0, 0.4); padding: 6px 14px; border-radius: 12px; border: 1px solid #ff4444; font-size: 0.85rem; font-family: 'Poppins', sans-serif; display: none; margin-top: 2px;"></div>
            <div class="entry-btn-wrapper">
                <a href="#" id="enterBtn" class="btn-noel">Entrer dans la magie ✨</a>
            </div>
            <p style="font-size: 0.75rem; opacity: 0.85; margin: 4px 0 0 0; color: #ffd700; font-family: 'Poppins', sans-serif;">
                ✨ Première visite ? Ton mot de passe sera enregistré pour ton prénom !
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVQh_y9U1D5gA7BmCCFJgOlEPlUAogxV8",
            authDomain: "santa-secret-3c1f4.firebaseapp.com",
            projectId: "santa-secret-3c1f4",
            storageBucket: "santa-secret-3c1f4.firebasestorage.app",
            messagingSenderId: "238129661360",
            appId: "1:238129661360:web:d6ccb73539dc67d9f68275"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function updateCountdown() {
            const targetDate = new Date('December 24, 2026 00:00:00').getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;
            if (diff <= 0) return;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        const enterBtn = document.getElementById('enterBtn');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginErrorMsg = document.getElementById('loginErrorMsg');

        // Pré-remplir le pseudo si déjà connu
        const savedUser = localStorage.getItem("username");
        if (savedUser) usernameInput.value = savedUser;

        function getUserId(name) {
            return name.trim().toLowerCase().replace(/[^a-z0-9à-ÿ]/gi, "_") || "user";
        }

        async function attemptLogin() {
            loginErrorMsg.style.display = 'none';
            const name = usernameInput.value.trim();
            const pwd = passwordInput.value.trim();

            if (!name) {
                loginErrorMsg.textContent = "S'il te plaît, entre ton nom ou prénom ! 🎅";
                loginErrorMsg.style.display = 'block';
                usernameInput.focus();
                return;
            }

            if (!pwd) {
                loginErrorMsg.textContent = "Entre ton mot de passe personnel ! 🔒";
                loginErrorMsg.style.display = 'block';
                passwordInput.focus();
                return;
            }

            enterBtn.textContent = "Vérification... ⏳";

            const userId = getUserId(name);
            const userRef = doc(db, "users", userId);

            try {
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    // Utilisateur existant : vérification du mot de passe individuel
                    const userData = userSnap.data();
                    if (userData.password && userData.password !== pwd) {
                        enterBtn.textContent = "Entrer dans la magie ✨";
                        loginErrorMsg.textContent = `Mot de passe incorrect pour ${name} ! 🔒`;
                        loginErrorMsg.style.display = 'block';
                        passwordInput.value = "";
                        passwordInput.focus();
                        return;
                    }

                    // Mot de passe correct : synchroniser avatar s'il existe
                    const finalName = userData.username || name;
                    localStorage.setItem("username", finalName);
                    if (userData.avatar) {
                        localStorage.setItem("userAvatar", userData.avatar);
                    }
                    localStorage.setItem("userPassword", pwd);
                    window.location.href = "menu.html";
                } else {
                    // Nouveau compte : enregistrement automatique avec ce mot de passe
                    const userAvatar = localStorage.getItem("userAvatar") || "static/png/naima.png";
                    await setDoc(userRef, {
                        username: name,
                        password: pwd,
                        avatar: userAvatar,
                        createdAt: serverTimestamp()
                    });

                    localStorage.setItem("username", name);
                    localStorage.setItem("userPassword", pwd);
                    window.location.href = "menu.html";
                }
            } catch (err) {
                console.error("Erreur de connexion :", err);
                enterBtn.textContent = "Entrer dans la magie ✨";
                loginErrorMsg.textContent = "Erreur de connexion au serveur. Réessaie !";
                loginErrorMsg.style.display = 'block';
            }
        }

        enterBtn.onclick = (e) => {
            e.preventDefault();
            attemptLogin();
        };

        usernameInput.onkeyup = (e) => {
            if (e.key === "Enter") passwordInput.focus();
        };
        passwordInput.onkeyup = (e) => {
            if (e.key === "Enter") attemptLogin();
        };
    </script>
    <script src="static/java/audio.js"></script>
    <script src="static/java/theme.js"></script>
    <script src="static/java/effects.js"></script>
    <script src="static/java/noel-ui.js"></script>
    <script type="module" src="static/java/christmas-tree-3d.js"></script>
    <script src="static/java/transitions.js"></script>
    <script src="static/java/pwa-notifications.js"></script>
</body>
</html>
