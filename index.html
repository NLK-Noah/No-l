<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="static/png/naima.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Chango&display=swap" rel="stylesheet">
  <title>Le Festin d'Hiver</title>
  <link rel="stylesheet" href="static/css/noel-3d.css">
  <style>
      .countdown-container {
          text-align: center;
          margin: 30px auto;
          padding: 20px;
          background: rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(10px);
          border: 4px solid var(--gold);
          border-radius: 30px;
          width: 90%;
          max-width: 600px;
          color: white;
          font-family: 'Chango', cursive;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          position: relative;
          z-index: 100;
      }
      .countdown-logo {
          width: 180px;
          height: auto;
          margin-bottom: 15px;
          filter: drop-shadow(0 0 10px var(--bright-red));
      }
      .timer {
          display: flex;
          justify-content: center;
          gap: 20px;
          flex-wrap: wrap;
      }
      .timer-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          min-width: 80px;
      }
      .timer-val {
          font-size: 3rem;
          font-weight: bold;
          color: white;
          text-shadow: 0 0 10px var(--bright-red);
      }
      .timer-label {
          font-size: 0.9rem;
          color: var(--gold);
          text-transform: uppercase;
      }
  </style>
</head>
<body>
    <div class="header-space"></div>
    <div id="snow-container"></div>

    <img id="logo" src="static/png/mai.png" class="logo" alt="Logo" />

    <div class="countdown-container">
        <img src="static/png/Grinch.png" class="countdown-logo" alt="Grinch">
        <div class="timer">
            <div class="timer-item"><span id="days" class="timer-val">00</span><span class="timer-label">Jours</span></div>
            <div class="timer-item"><span id="hours" class="timer-val">00</span><span class="timer-label">Heures</span></div>
            <div class="timer-item"><span id="mins" class="timer-val">00</span><span class="timer-label">Mins</span></div>
            <div class="timer-item"><span id="secs" class="timer-val">00</span><span class="timer-label">Secs</span></div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px; position: relative; z-index: 100;">
        <a href="menu.html" class="btn-noel">Entrer dans la magie ✨</a>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date('December 24, 2026 00:00:00').getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                // Replace the image with a joyful text if it's Christmas
                document.querySelector('.countdown-logo').outerHTML = '<h2 style="color: #ffd700; font-size: 2rem;">🎄 JOYEUX NOËL ! 🎄</h2>';
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('mins').innerText = m.toString().padStart(2, '0');
            document.getElementById('secs').innerText = s.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
    <script src="static/java/theme.js"></script>
    <script src="static/java/effects.js"></script>
    <script src="static/java/noel-ui.js"></script>
</body>
</html>
