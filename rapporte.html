<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport du Menu - Le Festin d'Hiver</title>
<link rel="stylesheet" href="static/css/noel-3d.css">
<style>
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #1a472a 0%, #052210 100%) !important;
        font-family: 'Comic Sans MS', 'Arial', sans-serif;
        overflow-x: hidden;
    }
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        position: relative;
        z-index: 100;
    }
    .messages-area {
        flex: 1;
        padding: 80px 20px 100px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;
        box-sizing: border-box;
    }
    .msg-wrapper {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 85%;
    }
    .msg-me-wrapper {
        align-self: flex-end;
        flex-direction: row-reverse;
    }
    .msg-them-wrapper {
        align-self: flex-start;
        flex-direction: row;
    }
    .chat-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        object-fit: cover;
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        background: rgba(0,0,0,0.4);
    }
    .msg {
        padding: 10px 14px;
        border-radius: 15px;
        font-size: 1rem;
        position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        border: 2px solid var(--gold);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        word-break: break-word;
    }
    .msg-me {
        background: linear-gradient(135deg, var(--bright-red), var(--dark-red));
        color: white;
        border-bottom-right-radius: 2px;
    }
    .msg-them {
        background: white;
        color: #333;
        border-bottom-left-radius: 2px;
    }
    .like-btn {
        background: none;
        border: 1px solid var(--gold);
        border-radius: 10px;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
        color: inherit;
    }
    .like-btn.liked {
        background: var(--gold);
        color: var(--dark-red);
    }
    .input-bar {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        padding: 10px;
        border-radius: 50px;
        border: 3px solid var(--gold);
        z-index: 1000;
    }
    .input-bar input {
        flex: 1;
        padding: 12px 20px;
        border-radius: 25px;
        border: none;
        background: white;
        color: #333;
        font-size: 1rem;
        outline: none;
    }
    .input-bar button {
        background: var(--gold);
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        color: var(--dark-red);
        box-shadow: 0 4px 0 #b8860b;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        width: 50px;
    }
</style>
<link rel="stylesheet" href="static/css/transitions.css">
<link rel="stylesheet" href="static/css/christmas-camera.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<a href="menu.html" class="back-btn">
    <img src="static/png/back.png" style="width: 100%" alt="Retour">
</a>

<div class="chat-container">
    <div class="messages-area" id="messages"></div>
    <div id="attachedPreview"></div>
    <div class="input-bar">
        <button type="button" class="chat-media-btn" id="chatPhotoBtn" title="Envoyer une photo">📷</button>
        <input type="text" id="messageInput" placeholder="Propose un plat pour le menu...">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script src="static/java/christmas-camera.js"></script>
<script type="module">
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, updateDoc, doc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js"; 
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

const firebaseConfig = {
    apiKey: "AIzaSyBVQh_y9U1D5gA7BmCCFJgOlEPlUAogxV8",
    authDomain: "santa-secret-3c1f4.firebaseapp.com",
    projectId: "santa-secret-3c1f4",
    storageBucket: "santa-secret-3c1f4.firebasestorage.app",
    messagingSenderId: "238129661360",
    appId: "1:238129661360:web:d6ccb73539dc67d9f68275"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const messagesRef = collection(db, "messages");
const q = query(messagesRef, orderBy("timestamp", "asc"));
const messagesList = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const currentUser = localStorage.getItem("username") || "Inconnu";
let pendingPhotoBase64 = null;
const chatPhotoBtn = document.getElementById('chatPhotoBtn');
const attachedPreview = document.getElementById('attachedPreview');

async function toggleLike(messageId, currentLikesArray) {
    const messageDocRef = doc(db, "messages", messageId);
    if (currentLikesArray.includes(currentUser)) {
        await updateDoc(messageDocRef, { likes: arrayRemove(currentUser) });
    } else {
        await updateDoc(messageDocRef, { likes: arrayUnion(currentUser) });
    }
}

onSnapshot(q, (snapshot) => {
    messagesList.innerHTML = ""; 
    snapshot.forEach((doc) => {
        const msg = doc.data();
        const isMe = msg.sender === currentUser;
        const wrapper = document.createElement("div");
        wrapper.className = 'msg-wrapper ' + (isMe ? 'msg-me-wrapper' : 'msg-them-wrapper');
        
        const avatarSrc = msg.avatar || (isMe ? (localStorage.getItem('userAvatar') || 'static/png/naima.png') : 'static/png/naima.png');
        const likes = msg.likes || [];
        const isLiked = likes.includes(currentUser);
        
        wrapper.innerHTML = `
            <img src="${avatarSrc}" class="chat-avatar" alt="${msg.sender}">
            <div class="msg ${isMe ? 'msg-me' : 'msg-them'}">
                <span><strong>${msg.sender}</strong>: ${msg.content}</span>
                ${msg.photo ? `<img src="${msg.photo}" class="chat-photo-img" onclick="ChristmasCamera.openLightbox(this.src)" alt="Photo">` : ''}
                <button class="like-btn ${isLiked ? 'liked' : ''}" data-id="${doc.id}">
                    ❤️ ${likes.length}
                </button>
            </div>
        `;
        messagesList.appendChild(wrapper);
    });

    document.querySelectorAll('.like-btn').forEach(button => {
        button.onclick = (e) => {
            const id = e.target.dataset.id;
            const docData = snapshot.docs.find(d => d.id === id);
            if (docData) toggleLike(id, docData.data().likes || []);
        };
    });
    messagesList.scrollTop = messagesList.scrollHeight;
});

sendBtn.onclick = async () => {
    const content = input.value.trim();
    if (content || pendingPhotoBase64) {
        const userAvatar = localStorage.getItem('userAvatar') || '';
        const docData = {
            sender: currentUser,
            content: content,
            timestamp: serverTimestamp(),
            likes: [],
            avatar: userAvatar
        };
        if (pendingPhotoBase64) {
            docData.photo = pendingPhotoBase64;
        }
        await addDoc(messagesRef, docData);
        input.value = "";
        pendingPhotoBase64 = null;
        attachedPreview.innerHTML = '';
    }
};

input.onkeyup = (e) => { if (e.key === "Enter") sendBtn.click(); };

// Photo attachment

chatPhotoBtn.onclick = () => {
    ChristmasCamera.open({
        title: "Photo de Noël 📸",
        maxDim: 600,
        onCapture: (base64) => {
            pendingPhotoBase64 = base64;
            attachedPreview.innerHTML = `
                <div class="chat-attached-preview">
                    <img src="${base64}" alt="Photo attachée">
                    <span>📷 Photo prête à envoyer</span>
                    <button class="chat-attached-remove" id="removeAttached">✕</button>
                </div>
            `;
            document.getElementById('removeAttached').onclick = () => {
                pendingPhotoBase64 = null;
                attachedPreview.innerHTML = '';
            };
        }
    });
};
</script>
<script src="static/java/audio.js"></script>
<script src="static/java/theme.js"></script>
<script src="static/java/effects.js"></script>
<script src="static/java/noel-ui.js"></script>
<script src="static/java/transitions.js"></script>
</body>
</html>
