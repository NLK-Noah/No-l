<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil - Le Festin d'Hiver</title>
  <link rel="stylesheet" href="static/css/noel-3d.css">
  <style>
      body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          margin: 0;
          padding: 20px;
      }
      .profile-container {
          text-align: center;
          background: rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(15px);
          border: 6px solid var(--gold);
          border-radius: 40px;
          padding: 40px;
          color: white;
          font-family: 'Comic Sans MS', 'Arial', sans-serif;
          box-shadow: 0 20px 50px rgba(0,0,0,0.8);
          width: 90%;
          max-width: 600px;
      }
      .avatar-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
          margin: 30px 0;
      }
      .avatar-option {
          cursor: pointer;
          transition: transform 0.3s, box-shadow 0.3s;
          border: 4px solid transparent;
          border-radius: 20px;
          padding: 10px;
          background: rgba(255,255,255,0.1);
      }
      .avatar-option img {
          width: 80px;
          height: 80px;
          object-fit: contain;
      }
      .avatar-option.selected {
          border-color: var(--gold);
          background: rgba(255,215,0,0.2);
          box-shadow: 0 0 20px var(--gold);
          transform: scale(1.1);
      }
      .save-btn {
          background: var(--gold);
          border: none;
          padding: 15px 30px;
          border-radius: 25px;
          font-weight: bold;
          cursor: pointer;
          color: var(--dark-red);
          font-size: 1.2rem;
          text-transform: uppercase;
      }
  </style>
<link rel="manifest" href="manifest.json">
</head>
<body style="background: radial-gradient(circle at center, #1a472a 0%, #052210 100%) !important;">
    <div class="profile-container">
        <h1 style="color: var(--gold); text-align: center;">Choisis ton Avatar 🎄</h1>
        <p>Comment veux-tu apparaître dans le chat ?</p>
        <div class="avatar-grid" id="avatarGrid">
            <!-- Avatars will be added here -->
        </div>
        <button class="save-btn" id="saveAvatar">Enregistrer mon profil ✨</button>
    </div>

    <script>
        const avatars = [
            { id: 'lutin', img: 'static/png/lutin.png', label: 'Lutin' },
            { id: 'renne', img: 'static/png/renne.png', label: 'Renne' },
            { id: 'sapin', img: 'static/png/sapin.png', label: 'Sapin' }
        ];
        let selectedAvatar = localStorage.getItem('userAvatar') || 'lutin';

        const grid = document.getElementById('avatarGrid');
        avatars.forEach(av => {
            const div = document.createElement('div');
            div.className = `avatar-option ${av.id === selectedAvatar ? 'selected' : ''}`;
            div.innerHTML = `<img src="${av.img}" alt="${av.label}">`;
            div.onclick = () => {
                document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                selectedAvatar = av.id;
            };
            grid.appendChild(div);
        });

        document.getElementById('saveAvatar').onclick = () => {
            localStorage.setItem('userAvatar', selectedAvatar);
            alert("Profil enregistré !");
            window.location.href = "menu.html";
        };
    </script>
    <script src="static/java/theme.js"></script>
    <script src="static/java/effects.js"></script>
    <script src="static/java/noel-ui.js"></script>
</body>
</html>
